          "alternateName": "Preparation Tracker",
          "url": "https://tracking-prep.web.app/",

          "image": "https://tracking-prep.web.app/og-preview.png",
          "description": "PrepFlow (Preparation Tracker) is an intelligent learning and progress tracking workspace that uses spaced repetition, AI coaching, habit tracking, and analytics to help students and software engineers prepare for technical interviews and master coding skills.",
          "applicationCategory": "EducationalApplication, SoftwareApplication",
          "operatingSystem": "Web, Android",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "featureList": [
            "Spaced Repetition Topic Tracking (SM-2 Algorithm)",
            "Question Bank with Active Recall",
            "AI Spoken Mock Interviews with Real-time Scoring",
            "Gesture-Based Hands-free Navigation (Webcam Hand Tracking)",
            "Mistake Pattern Journal",
            "Daily Study Planner & Roadmaps",
            "Granular Speech and Pace Analytics",
            "Cloud Sync with Firebase Integration"
          ],
          "screenshot": "https://tracking-prep.web.app/og-preview.png",
          "author": {
            "@type": "Organization",
            "name": "PrepFlow Team"
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://tracking-prep.web.app/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is PrepFlow / Preparation Tracker really free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, PrepFlow is completely free and open-source under the Apache-2.0 license. There are no hidden fees, no premium tiers, and no ads. You can fork it, customize it, and deploy it yourself."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need to create an account to use PrepFlow?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. PrepFlow works entirely offline with local storage. Firebase authentication is optional and only required if you want to sync your study data across multiple devices."
              }
            },
            {
              "@type": "Question",
              "name": "How does the AI Mock Interview scoring work in PrepFlow?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "It uses the Gemini API to generate tailored interview questions, records your spoken responses via your microphone, transcribes them, and evaluates your keyword accuracy, filler words (like 'um' and 'uh'), clarity, and depth in real-time."
              }
            },
            {
              "@type": "Question",
              "name": "What is PrepFlow's gesture control feature?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Using MediaPipe's real-time hand tracking via your webcam, you can navigate the PrepFlow workspace hands-free. You can swipe to change tabs/questions, pinch to click buttons, and point to scroll."
              }
            },
            {
              "@type": "Question",
              "name": "Can I use PrepFlow (Preparation Tracker) on my phone?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. The app includes a Capacitor configuration for Android with native speech-to-text, text-to-speech, and push notifications. The standard web app is also fully mobile-responsive."
              }
            },
            {
              "@type": "Question",
              "name": "How does spaced repetition work in PrepFlow?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "PrepFlow implements the SM-2 spaced repetition algorithm, which calculates optimal review intervals based on your self-reported confidence ratings. Difficult topics appear more frequently, while mastered topics are spaced further apart."
              }
            },
            {
              "@type": "Question",
              "name": "How can PrepFlow help me study and practice for coding interviews?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "PrepFlow provides structured coding roadmaps, spaced repetition flashcards for active recall practice, and an AI mock interviewer that transcribes your speech and grades your answers. It is the ultimate workspace to organize your interview preparation."
              }
            },
            {
              "@type": "Question",
              "name": "What is the best way to structure my tech interview preparation?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "An effective preparation strategy involves mapping your target subjects, using spaced repetition to practice key concepts daily, tracking mistakes in a mistake journal, and conducting realistic AI mock interviews to practice verbal delivery. PrepFlow bundles all of these tools into a single free workspace."
              }
            }
          ]
        }
      ]
    }
